name: NostxlgIA site-wide and municipal QA
on:
  push:
    branches:
      - main
      - improve/auditoria-justificada-2026-11-03
    paths:
      - '**/*.html'
      - 'assets/css/**'
      - 'assets/js/**'
      - 'assets/images/**'
      - 'assets/data/**'
      - 'scripts/**'
      - 'content/**'
      - 'robots.txt'
      - 'sitemap.xml'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '**/*.html'
      - 'assets/css/**'
      - 'assets/js/**'
      - 'assets/data/**'
      - 'scripts/**'
      - 'content/**'
      - 'robots.txt'
      - 'sitemap.xml'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  municipal-article:
    name: Browser and visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser automation
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Validate JavaScript syntax
        run: |
          node --check assets/js/population-article.js
          node --check scripts/tests/analysis.cjs
          node --check scripts/tests/population-visual.cjs
          node --check scripts/tests/site-wide.cjs
          node --check assets/js/data-library-v2.js
          node --check assets/js/denue-context-map-v4.js
      - name: Verify generated article matches editorial source
        run: |
          python scripts/build_analysis.py
          git diff --exit-code -- analisis/index.html analisis/poblacion-durango/index.html
      - name: Functional and numeric regression
        run: node scripts/tests/analysis.cjs
      - name: Visual and responsive regression
        run: node scripts/tests/population-visual.cjs
      - name: Whole-site browser and content audit
        run: node scripts/tests/site-wide.cjs
      - name: Preserve exact QA source for reproducibility
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: population-qa-source
          path: |
            analisis/
            assets/
            scripts/
            content/analisis/
            index.html
            404.html
            datos/
            servicios/
            proyectos/
            contacto/
            privacidad/
            robots.txt
            sitemap.xml
          retention-days: 3
          if-no-files-found: error
      - name: Preserve browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: population-qa-screenshots
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14
